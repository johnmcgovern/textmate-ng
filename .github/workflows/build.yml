name: CI

on: [push]

jobs:
  # Stream 6: build the hand-authored TextMate.xcodeproj via xcodebuild. This also
  # exercises Stream 2's reproducible-deps path end-to-end: the seed's DEP_PREFIXES
  # defaults to `brew --prefix`, so no TM_DEP_PREFIX override is set here — the
  # Xcode build resolves capnp/kj/boost/sparsehash (and the capnp/ragel codegen
  # tools) straight out of Homebrew.
  #
  # The rave/ninja build this once ran alongside is gone (tag `rave-final`) — the
  # rave parity audit in PROJECT_PHASES.md found no functional gap remaining.
  xcode:
    runs-on: macos-latest

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      RUBYOPT: "-EUTF-8"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Setup
      run: |
        # The runner image ships aws/tap pre-tapped. We don't install anything from
        # it, and an untrusted tap makes every later `brew` call print a tap-trust
        # warning, so drop it rather than blanket-trusting it.
        brew untap aws/tap || true
        # multimarkdown: the About pages are compiled from Markdown at build time
        # (bin/gen_html).
        brew install boost capnp google-sparsehash ragel multimarkdown
        gem install --user-install xcodeproj
    - name: Generate TextMate.xcodeproj
      # ide/gen/ is gitignored (regenerated). extract_specs -> specs.json, then
      # seed_xcodeproj authors the .pbxproj + the <fw/header.h> include farm.
      run: |
        mkdir -p ide/gen
        ruby ide/extract_specs.rb > ide/gen/specs.json
        ruby ide/seed_xcodeproj.rb
    - name: Build
      run: xcodebuild -project TextMate.xcodeproj -target TextMate -configuration Release build
    # Stream 7: the ~25 per-framework XCTest bundles. These suites had no build rule
    # under rave and had not been built since Feb 2021, so a set of long-dormant
    # failures is skipped by name in the generated AllTests scheme (see SKIPPED_TESTS
    # in ide/seed_xcodeproj.rb, which records why each one fails). Green therefore
    # means "nothing got worse", and any new failure here is a real regression.
    - name: Test
      run: xcodebuild test -project TextMate.xcodeproj -scheme AllTests -configuration Debug
