name: CI

on: [push]

# Supersede an in-flight run when a newer commit lands on the same ref, so the
# signal you wait on is always for the newest commit rather than a queued backlog
# of stale ones. Keyed per-ref, so pushes to different branches don't cancel each
# other. A full run is ~6.5 min, most of it Build + Test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stream 6: build the hand-authored TextMate.xcodeproj via xcodebuild. This also
  # exercises Stream 2's reproducible-deps path end-to-end: the seed's DEP_PREFIXES
  # defaults to `brew --prefix`, so no TM_DEP_PREFIX override is set here — the
  # Xcode build resolves capnp/kj/boost/sparsehash (and the capnp/ragel codegen
  # tools) straight out of Homebrew.
  #
  # The rave/ninja build this once ran alongside is gone (tag `rave-final`) — the
  # rave parity audit in PROJECT_PHASES.md found no functional gap remaining.
  xcode:
    runs-on: macos-latest
    # Without this a stuck job runs to GitHub's 6-hour default. The exposure is the
    # Test step (~205s of the ~390s run): the AllTests scheme includes the GUI
    # harnesses, which can block rather than fail. 30 min is ~4.5x the current
    # runtime, so it won't fire on ordinary growth.
    timeout-minutes: 30

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      RUBYOPT: "-EUTF-8"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Setup
      run: |
        # The runner image ships aws/tap pre-tapped. We don't install anything from
        # it, and an untrusted tap makes every later `brew` call print a tap-trust
        # warning, so drop it rather than blanket-trusting it.
        brew untap aws/tap || true
        # multimarkdown: the About pages are compiled from Markdown at build time
        # (bin/gen_html).
        brew install boost capnp google-sparsehash ragel multimarkdown
        # Pinned: this gem authors the entire .pbxproj, so an unpinned major/minor
        # can break CI with no commit touching the repo — the one unpinned input in
        # an otherwise reproducible dep chain (the brew deps are bottle-pinned).
        # 1.28.1 is what this project is developed against locally.
        gem install --user-install xcodeproj -v 1.28.1
    - name: Generate TextMate.xcodeproj
      # ide/gen/ is gitignored (regenerated). extract_specs -> specs.json, then
      # seed_xcodeproj authors the .pbxproj + the <fw/header.h> include farm.
      run: |
        mkdir -p ide/gen
        ruby ide/extract_specs.rb > ide/gen/specs.json
        ruby ide/seed_xcodeproj.rb
    - name: Build
      # -parallelizeTargets: without it xcodebuild walks targets in the order the
      # seed added them and warns that manual order is deprecated. It has to be a
      # command-line flag — the project-level "Parallelize build for command-line
      # builds" attribute (BuildIndependentTargetsInParallel) is ignored on a
      # -target build, with either 1 or YES. Safe because every edge is declared
      # via add_dependency in ide/seed_xcodeproj.rb, so independent targets really
      # are independent. The Test step below builds via -scheme, which already
      # parallelizes and never warned.
      run: xcodebuild -project TextMate.xcodeproj -target TextMate -configuration Release -parallelizeTargets build
    # Stream 7: the ~25 per-framework XCTest bundles. These suites had no build rule
    # under rave and had not been built since Feb 2021, so a set of long-dormant
    # failures is skipped by name in the generated AllTests scheme (see SKIPPED_TESTS
    # in ide/seed_xcodeproj.rb, which records why each one fails). Green therefore
    # means "nothing got worse", and any new failure here is a real regression.
    - name: Test
      # Piped through a crash check rather than trusting the exit status alone: when a
      # test *crashes* the runner rather than failing an assertion, XCTest relaunches
      # and re-reports, and the final relaunch — which has no tests left to run —
      # prints "Test Suite … passed". xcodebuild's own status flaps between 0 and 65
      # across runs of the identical crash, so a crashing test could land as a green
      # build. That is not hypothetical: PreferencesWindowTests has crashed the runner
      # on every run since at least 2026-08-18 while CI reported success roughly half
      # the time, and local full-suite runs counted the empty relaunch as a pass.
      #
      # "Restarting after unexpected exit, crash, or test timeout" is the only line
      # that reliably marks it, so grep for it and fail regardless of the exit status.
      run: |
        set -o pipefail
        test_status=0
        xcodebuild test -project TextMate.xcodeproj -scheme AllTests -configuration Debug 2>&1 | tee /tmp/test.log || test_status=$?
        if grep -q "Restarting after unexpected exit, crash, or test timeout" /tmp/test.log; then
          echo "::error::A test process crashed (not an assertion failure). The tests that were running when it died:"
          grep -B2 "Restarting after unexpected exit" /tmp/test.log | grep "Test Case" || true
          exit 1
        fi
        exit $test_status
