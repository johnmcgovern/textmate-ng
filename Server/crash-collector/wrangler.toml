# Deploy with:  wrangler deploy        — **from this directory**. Run it from the
# repository root and wrangler finds no config there, falls through to its
# Cloudflare Pages path, and fails with "Could not detect a directory containing
# static files", which names neither the real problem nor this file.
#
# Create the bucket once, first:  wrangler r2 bucket create textmate-ng-diagnostics
#
# `main` is the Worker; REPORTS is the R2 binding it writes through. Nothing here
# is secret — the bucket is private, and the Worker never lists it over HTTP.

# Pinned to J23 Labs - Developer (developer@j23labs.com). The OAuth token
# wrangler stores is per *user*, not per account, and records no account of its
# own — so without this line, which account a deploy reaches is decided at
# deploy time. Today that login sees only this account; a later `wrangler login`
# from a personal account would change that without warning, and crash reports
# would go somewhere they were never meant to.
account_id = "c314d5670a6a5322c71be2775af1e27e"

name = "textmate-ng-crash-collector"
main = "src/worker.js"
# Not today's date: the local `wrangler dev` runtime refuses a date newer than the
# workerd binary it ships with (2026-07-13 for wrangler 4.108), and bin/test-local
# is the only thing that runs this Worker before it is deployed.
compatibility_date = "2026-07-01"

# What a crash report must say about itself to be accepted. Both are compared
# against codeSigningID / codeSigningTeamID in the report's own second JSON
# document, which macOS writes from the crashed process's real code signature.
#
# EXPECTED_TEAM_ID is here rather than in the source because it is going to
# change: J23 is enrolled as an individual, and an organization enrollment
# reissues the Team ID. When that happens this is the edit, plus a redeploy —
# and reports from builds signed with the old one stop being accepted, so change
# it when the first build under the new team ships, not before.
[vars]
EXPECTED_SIGNING_ID = "com.j23software.TextMate-NG"
EXPECTED_TEAM_ID = "R22V2H7QF4"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "textmate-ng-diagnostics"
# Only used by `wrangler dev --remote`; bin/test-local runs --local, where
# miniflare simulates the bucket and this name is just a label.
preview_bucket_name = "textmate-ng-diagnostics-preview"

[observability]
enabled = true
